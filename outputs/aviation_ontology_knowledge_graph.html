<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>航空本体语义层 · 分层知识图谱</title>
<style>
:root{
  --ink:#0E1422; --line:#25304A;
  --serif:"Songti SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#C6CFE2;font-family:var(--sans);-webkit-font-smoothing:antialiased}
header{padding:20px 22px 4px;max-width:1100px;margin:0 auto}
header h1{font-size:18px;margin:0 0 4px;font-weight:700;color:#EAEEF7}
header p{margin:0;color:#8B96AE;font-size:13px;line-height:1.6}
.stage{margin:16px auto;max-width:1100px;background:radial-gradient(120% 130% at 50% 0%,#161D2E 0%,#0C111C 80%);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
#graph-box{position:relative;height:780px;overflow:hidden}
@media(max-width:680px){#graph-box{height:620px}}
#graph-svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}

/* ----- 五层横带（仅 layered 模式） ----- */
.gband-line{stroke:#22304C;stroke-width:1;stroke-dasharray:4 7;stroke-opacity:.7}
.gband-cap{fill:#5E6E92;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.gband-sub{fill:#9AA7C4;font-family:var(--sans);font-size:13px;font-weight:600}
.gband-band:nth-child(odd){fill:#121A2B} .gband-band{fill:#0E1626;opacity:.5}

/* ----- 节点 / 连线 / 标签 ----- */
.gnode{cursor:grab}.gnode.dragging{cursor:grabbing}
.gnode,.glink,.gelabel{transition:opacity .22s ease}
.gnode.dim{opacity:.12}.glink.dim{opacity:.04}.gelabel.dim{opacity:0}
.gn-core{transition:transform .2s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center}
.gnode.pop .gn-core{transform:scale(1.28)}
.glabel{fill:#C6CFE2;paint-order:stroke;stroke:#0B1018;stroke-width:3px;stroke-linejoin:round;
  font-size:10px;font-family:var(--sans)}
.gnode.pop .glabel{fill:#fff;font-weight:700;font-size:11.5px}
.gelabel{fill:#8B96AE;font-size:8.5px;font-family:var(--mono);opacity:0}

/* ----- 工具条 / 图例 / 详情 ----- */
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:6}
.tb-btn{font-size:12px;font-family:var(--mono);color:#C6CFE2;background:rgba(20,26,40,.7);
  border:1px solid #2A3650;border-radius:8px;padding:6px 11px;cursor:pointer}
.tb-btn:hover{background:#1E2A44;color:#fff}
#g-search{flex:1 1 130px;min-width:120px;font-size:12.5px;color:#E6EBF5;background:rgba(20,26,40,.7);
  border:1px solid #2A3650;border-radius:8px;padding:7px 11px;font-family:var(--sans)}
#g-search::placeholder{color:#7782A0}
.legend{display:flex;flex-wrap:wrap;gap:7px;padding:14px;border-top:1px solid #25304A;background:#0E1421}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#AEB8CE;cursor:pointer;
  padding:4px 9px;border-radius:18px;border:1px solid transparent}
.lg:hover{border-color:#2A3650}
.lg.active{background:#1A2336;border-color:#3A4E6E;color:#fff}
.lg .sw{width:11px;height:11px;border-radius:50%}
.g-pop{position:absolute;z-index:8;background:#161D2E;border:1px solid #2C3A58;border-radius:11px;
  box-shadow:0 10px 34px rgba(0,0,0,.5);padding:11px 13px;font-size:12.5px;color:#D4DAE8;
  pointer-events:none;max-width:250px;line-height:1.55}
.g-pop b{color:#fff}
#g-detail{padding:16px 18px;border-top:1px solid #25304A;background:#0E1421;min-height:64px;font-size:13.5px}
#g-detail .ph{color:#7E8AA6;font-family:var(--mono);font-size:11.5px}
#g-detail .nm{font-family:var(--serif);font-size:18px;color:#fff;margin:2px 0 6px}
#g-detail .gp{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:12px;margin-left:8px;vertical-align:middle}
#g-detail .ds{color:#B6C0D6;margin:6px 0 4px}
#g-detail .pr{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid #1E2840;font-size:12.5px}
#g-detail .pr span{color:#828FAB} #g-detail .pr b{color:#DCE2EF}
#g-detail .nbtit{margin-top:12px;color:#7E8AA6;font-size:11.5px;font-family:var(--mono)}
#g-detail .nb{display:inline-block;margin:4px 4px 0 0;padding:3px 9px;border-radius:8px;font-size:12px;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header>
  <h1>航空本体语义层 · 分层知识图谱</h1>
  <p>5 实体 + 3 关系 + 2 规则 · 概念模型到物理字段级血缘 · 自包含、零依赖、可离线打开。颜色表示知识类别，横带表示从运行场景到物理字段的数据层级。</p>
</header>

<div class="stage">
  <div id="graph-box">
    <div class="toolbar">
      <input id="g-search" type="text" placeholder="搜索节点…" autocomplete="off">
      <button class="tb-btn" id="g-mode">切换布局</button>
      <button class="tb-btn" id="g-reset">重置视图</button>
      <button class="tb-btn" id="g-relayout">重新布局</button>
    </div>
    <svg id="graph-svg"></svg>
  </div>
  <div class="legend" id="g-legend"></div>
  <div id="g-detail"></div>
</div>

<script>
/* ============================================================
   1) 布局模式： "layered"（纵向分层横带） | "force"（自由力导向）
   ============================================================ */
let LAYOUT="layered";

/* ============================================================
   2) 数据 —— 换成你自己的领域数据
   - GROUPS：颜色分组（决定节点颜色 + 图例 + 高亮筛选维度）
   - LAYERS：纵向层带（仅 layered 模式生效）。每层声明它包含哪些 group。
             颜色仍按 GROUPS，层带只决定纵向位置 → 颜色与结构是两个独立维度。
   - NODES ：id 唯一；group 必须是 GROUPS 里的 id；desc/props 用于详情面板。
   - EDGES ：[source, target, relation] 三元组；source/target 必须是节点 id。
   下面是一份与具体业务无关的「系统架构」示例数据，仅作占位演示。
   ============================================================ */
const GROUPS=[
  {id:"context",label:"运行场景",color:"#E8924B"},
  {id:"entity",label:"本体实体",color:"#34B3C7"},
  {id:"relation",label:"语义关系",color:"#A47BE0"},
  {id:"rule",label:"推理与约束",color:"#E0574F"},
  {id:"view",label:"DWD 语义视图",color:"#5FB87A"},
  {id:"table",label:"ODS 物理表",color:"#5B8FF0"},
  {id:"field",label:"字段与字典",color:"#E8B84B"},
  {id:"case",label:"经验案例",color:"#C96C8A"}
];

const LAYERS=[
  {key:1,label:"运行场景",en:"Scenario",groups:["context","case"]},
  {key:2,label:"本体实体",en:"Ontology",groups:["entity"]},
  {key:3,label:"关系与规则",en:"Reasoning",groups:["relation","rule"]},
  {key:4,label:"语义视图",en:"DWD",groups:["view"]},
  {key:5,label:"物理字段",en:"ODS / Field",groups:["table","field"]}
];

const NODES=[
  {id:"C1",label:"航空延误决策",group:"context",desc:"天气、航班、机组和跑道容量共同驱动的运行处置场景。",props:[["目标","安全、合规、可解释"],["入口","数据实验室 / 数据服务"]]},
  {id:"C2",label:"广州出发航班",group:"context",desc:"演示固定航线：广州白云起飞，延误后触发决策。",props:[["起飞","ZGGG"],["航司","CZ"]]},
  {id:"K1",label:"广州雷暴延误",group:"case",desc:"强雷暴影响广州出发航班，延误 85 分钟。",props:[["推理","WeatherDelayedFlight"],["建议","后移时隙 + 旅客通知"]]},
  {id:"K2",label:"机组超限",group:"case",desc:"候选机组连续值勤超过 13 小时，原方案必须阻断。",props:[["约束","DUTY_OVER_LIMIT"],["建议","改派合规机组"]]},
  {id:"K3",label:"容量下降",group:"case",desc:"雷暴窗口跑道可用容量下降到公布容量的 45%。",props:[["规则","capacity_ratio < 0.7"],["建议","申请下一时隙"]]},
  {id:"E1",label:"FlightSegment",group:"entity",desc:"一次具有稳定架次 ID、时刻和执行状态的航班运行单元。",props:[["物理表","ods_flight_schedule"],["主键","flight_segment_id"]]},
  {id:"E2",label:"AircraftTail",group:"entity",desc:"以机尾号识别的物理航空器资产，含 MEL 和当前站点。",props:[["物理表","ods_aircraft_tail"],["主键","tail_no"]]},
  {id:"E3",label:"CrewMember",group:"entity",desc:"具有角色、机型资质、值勤和休息时长的机组成员。",props:[["物理表","ods_crew_roster"],["主键","crew_id"]]},
  {id:"E4",label:"WeatherEvent",group:"entity",desc:"机场与观测时刻的强天气事件，来自 METAR 快照。",props:[["物理表","ods_weather_metar"],["主键","airport_icao#observe_time"]]},
  {id:"E5",label:"RunwayCapacity",group:"entity",desc:"机场跑道在指定小时的公布、可用容量和限制原因。",props:[["物理表","ods_runway_slot"],["主键","airport_icao#runway_id#slot_hour"]]},
  {id:"R1",label:"operatedBy",group:"relation",desc:"FlightSegment 由哪架物理飞机执飞。",props:[["连接","flight_schedule.tail_no = aircraft_tail.tail_no"],["视图","dwd_rel_flight_operated_by_tail"]]},
  {id:"R2",label:"staffedBy",group:"relation",desc:"FlightSegment 配备哪些机组成员。",props:[["连接","flight_no = assigned_flight_no"],["视图","dwd_rel_flight_staffed_by_crew"]]},
  {id:"R3",label:"impacts",group:"relation",desc:"WeatherEvent 在机场和计划时刻窗口内影响航班。",props:[["连接","airport + observe/std hour"],["视图","dwd_rel_weather_impacts_flight"]]},
  {id:"Q1",label:"WeatherDelayedFlight",group:"rule",desc:"SWRL 风格推理：气象影响边存在且 delay_minutes > 0。",props:[["输出","dwd_rule_weather_delay_inferred"],["等级","INFO"]]},
  {id:"Q2",label:"CrewDutyBlock",group:"rule",desc:"SHACL 风格约束：值勤超限或休息不足，阻断调配方案。",props:[["输出","dwd_rule_crew_duty_violation"],["等级","BLOCK"]]},
  {id:"D1",label:"dwd_ent_flight_segment",group:"view",desc:"FlightSegment 语义实体视图，统一航班计划、执行和 CODA 代码。",props:[["来源","ods_flight_schedule + dim_delay_code_coda"]]},
  {id:"D2",label:"dwd_ent_aircraft_tail",group:"view",desc:"AircraftTail 语义实体视图。",props:[["来源","ods_aircraft_tail"]]},
  {id:"D3",label:"dwd_ent_crew_member",group:"view",desc:"CrewMember 语义实体视图。",props:[["来源","ods_crew_roster"]]},
  {id:"D4",label:"dwd_ent_weather_event",group:"view",desc:"仅保留严重天气事件的 WeatherEvent 视图。",props:[["来源","ods_weather_metar"]]},
  {id:"D5",label:"dwd_ent_runway_capacity",group:"view",desc:"RunwayCapacity 语义实体视图。",props:[["来源","ods_runway_slot"]]},
  {id:"D6",label:"dwd_rule_weather_delay",group:"view",desc:"天气延误推理输出视图。",props:[["来源","R3 + D1"]]},
  {id:"D7",label:"dwd_rule_crew_duty",group:"view",desc:"机组值勤约束输出视图。",props:[["来源","R2 + D3"]]},
  {id:"T1",label:"ods_flight_schedule",group:"table",desc:"支持手工和 Aviationstack 双来源的航班统一湖表。",props:[["主键","flight_segment_id"],["增量","std / source_updated_at"]]},
  {id:"T2",label:"ods_aircraft_tail",group:"table",desc:"航空器机尾、适航和 MEL 台账。",props:[["主键","tail_no"],["增量","updated_at"]]},
  {id:"T3",label:"ods_crew_roster",group:"table",desc:"机组排班、资质和值勤合规台账。",props:[["主键","crew_id"],["增量","updated_at"]]},
  {id:"T4",label:"ods_weather_metar",group:"table",desc:"可复现的 METAR 观测基线。",props:[["主键","airport_icao + observe_time"],["增量","observe_time / ingested_at"]]},
  {id:"T5",label:"ods_runway_slot",group:"table",desc:"跑道容量小时快照。",props:[["主键","airport_icao + runway_id + slot_hour"]]},
  {id:"T6",label:"dim_delay_code_coda",group:"table",desc:"CODA 延误代码标准字典，空表会导致语义层不可用。",props:[["标准码","71/63/41/89/81/00"]]},
  {id:"T7",label:"ods_action_log_clean",group:"table",desc:"去重后的处置动作审计表。",props:[["主键","action_id"],["用途","服务回写审计"]]},
  {id:"F1",label:"flight_segment_id",group:"field",desc:"FlightSegment 主键，保障增量更新和去重稳定。",props:[["表","ods_flight_schedule"],["角色","PK"]]},
  {id:"F2",label:"flight_no / dep_airport",group:"field",desc:"航班业务标识与起飞机场，参与 staffedBy/impacts 关系。",props:[["表","ods_flight_schedule"],["角色","JOIN_KEY"]]},
  {id:"F3",label:"std / delay_minutes",group:"field",desc:"计划起飞时间与延误分钟，是天气窗口和延误推理输入。",props:[["表","ods_flight_schedule"],["角色","TIME + RULE_INPUT"]]},
  {id:"F4",label:"tail_no",group:"field",desc:"航班到物理飞机的内外键字段。",props:[["表","ods_flight_schedule / ods_aircraft_tail"],["关系","operatedBy"]]},
  {id:"F5",label:"crew_id / assigned_flight_no",group:"field",desc:"机组主键与航班分配字段。",props:[["表","ods_crew_roster"],["关系","staffedBy"]]},
  {id:"F6",label:"duty_hours / rest_hours",group:"field",desc:"机组 SHACL 约束的核心输入。",props:[["表","ods_crew_roster"],["阈值","13h / 10h"]]},
  {id:"F7",label:"airport_icao / observe_time",group:"field",desc:"天气空间时间复合键。",props:[["表","ods_weather_metar"],["关系","impacts"]]},
  {id:"F8",label:"severity_level / raw_report",group:"field",desc:"天气严重度和原始 METAR 证据，原文可追溯。",props:[["表","ods_weather_metar"],["规则","SEVERE"]]},
  {id:"F9",label:"capacity_ratio",group:"field",desc:"跑道可用容量比例，范围 0–1。",props:[["表","ods_runway_slot"],["阈值","< 0.7 触发后移时隙建议"]]},
  {id:"F10",label:"coda_code / category_cn",group:"field",desc:"源延误原因到 CODA 分类的字典映射。",props:[["表","dim_delay_code_coda"],["示例","WX -> 71 天气"]]},
  {id:"F11",label:"action_type / plan_code",group:"field",desc:"处置动作写入的审计字段。",props:[["表","ods_action_log_clean"],["动作","REQUEST_SLOT / REASSIGN_CREW / PAX_NOTIFY"]]}
];

const EDGES=[
  ["C1","C2","聚焦"],["C1","K1","触发案例"],["C1","K2","约束案例"],["C1","K3","容量案例"],
  ["C2","E1","实例化"],["K1","E4","证据"],["K1","Q1","推理"],["K2","E3","证据"],["K2","Q2","约束"],["K3","E5","证据"],
  ["E1","R1","关系"],["E2","R1","关系"],["E1","R2","关系"],["E3","R2","关系"],["E4","R3","关系"],["E1","R3","关系"],
  ["R3","Q1","输入"],["E1","Q1","延误"],["R2","Q2","输入"],["E3","Q2","值勤"],
  ["E1","D1","实体视图"],["E2","D2","实体视图"],["E3","D3","实体视图"],["E4","D4","实体视图"],["E5","D5","实体视图"],
  ["Q1","D6","落地"],["Q2","D7","落地"],["R1","D2","关系视图"],["R2","D3","关系视图"],["R3","D4","关系视图"],
  ["D1","T1","读取"],["D1","T6","映射"],["D2","T2","读取"],["D3","T3","读取"],["D4","T4","读取"],["D5","T5","读取"],
  ["D6","T1","推理输入"],["D7","T3","约束输入"],["D6","T7","审计"],["D7","T7","审计"],
  ["T1","F1","主键"],["T1","F2","业务字段"],["T1","F3","规则字段"],["T1","F4","外键"],["T3","F5","关系字段"],["T3","F6","规则字段"],
  ["T4","F7","复合键"],["T4","F8","规则字段"],["T5","F9","质量字段"],["T6","F10","字典字段"],["T7","F11","动作字段"],
  ["F4","E2","关联键"],["F5","E3","关联键"],["F7","E4","关联键"],["F9","K3","阈值"],["F6","K2","阈值"],["F3","K1","阈值"]
];

/* ============================================================
   3) 引擎 —— 一般无需改动
   ============================================================ */
const NS="http://www.w3.org/2000/svg";
const COLOR=Object.fromEntries(GROUPS.map(g=>[g.id,g.color]));
const GLABEL=Object.fromEntries(GROUPS.map(g=>[g.id,g.label]));
const G2L={};LAYERS.forEach(L=>L.groups.forEach(g=>G2L[g]=L.key));
const CN=["一","二","三","四","五","六","七","八","九","十"];
let _seed=20240101; function rnd(){_seed=(_seed*1103515245+12345)&0x7fffffff;return _seed/0x7fffffff;}
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
const $=s=>document.querySelector(s);

const G={nodes:[],links:[],idx:{},nbr:{},alpha:0,view:{x:0,y:0,k:1},drag:null,pan:null,hover:null,
  raf:0,W:1000,H:780,root:null,bound:false,sel:null,litGroup:null};

function degree(){const d={};EDGES.forEach(e=>{d[e[0]]=(d[e[0]]||0)+1;d[e[1]]=(d[e[1]]||0)+1;});return d;}
function nodeR(deg,n){return Math.max(8,Math.min(22,7+(deg[n.id]||1)*1.3));}
function mkNode(n,L,by,li,r,x,y){return {...n,layer:L,by,li,color:COLOR[n.group],r,x,y,vx:0,vy:0,
  lw:Math.min(String(n.label).length,11)*11+10};}

function geom(){
  G.LBL=G.W<560?86:150;            // 左侧层标签留白
  G.padT=44;G.padB=28;
  G.bandH=(G.H-G.padT-G.padB)/LAYERS.length;
  G.x0=G.LBL+34;G.x1=G.W-66;
}
function bandY(L){return G.padT+G.bandH*(L-0.5);}

function build(){
  geom();
  const deg=degree();
  G.nodes=[];
  if(LAYOUT==="layered"){
    const byLayer={};for(let L=1;L<=LAYERS.length;L++)byLayer[L]=[];
    NODES.forEach(n=>{const L=G2L[n.group]||1;(byLayer[L]||byLayer[1]).push(n);});
    for(let L=1;L<=LAYERS.length;L++){
      const arr=byLayer[L];
      arr.sort((p,q)=>p.group<q.group?-1:p.group>q.group?1:(deg[q.id]||0)-(deg[p.id]||0));
      const cy=bandY(L),n_=arr.length;
      arr.forEach((n,i)=>{
        const r=nodeR(deg,n),t=n_>1?i/(n_-1):.5,x=G.x0+t*(G.x1-G.x0);
        const jit=((i%3)-1)*Math.min(34,G.bandH*0.30)*(0.45+0.55*rnd());
        G.nodes.push(mkNode(n,L,cy,i,r,x,cy+jit));
      });
    }
  }else{
    NODES.forEach((n,i)=>{
      const r=nodeR(deg,n),a=i*2.39996,rr=70+Math.sqrt(i+1)*34;
      G.nodes.push(mkNode(n,G2L[n.group]||1,0,i,r,G.W/2+Math.cos(a)*rr,G.H/2+Math.sin(a)*rr*.82));
    });
  }
  G.links=EDGES.map(e=>({s:e[0],t:e[1],label:e[2]}));
  G.idx=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  G.nbr={};G.links.forEach(l=>{(G.nbr[l.s]||(G.nbr[l.s]=new Set())).add(l.t);(G.nbr[l.t]||(G.nbr[l.t]=new Set())).add(l.s);});
}

function dom(svg){
  svg.innerHTML="";const root=el("g",{});G.root=root;
  const gb=el("g",{}),gl=el("g",{}),gn=el("g",{});
  if(LAYOUT==="layered"){
    for(let L=1;L<=LAYERS.length;L++){
      const top=G.padT+G.bandH*(L-1),cy=bandY(L);
      gb.appendChild(el("rect",{class:"gband-band",x:0,y:top,width:G.W,height:G.bandH}));
      gb.appendChild(el("line",{class:"gband-line",x1:G.LBL,y1:top,x2:G.W-10,y2:top}));
      const cap=el("text",{class:"gband-cap",x:22,y:cy-7});cap.textContent="第"+(CN[L-1]||L)+"层";gb.appendChild(cap);
      const sub=el("text",{class:"gband-sub",x:22,y:cy+13});sub.textContent=LAYERS[L-1].label;gb.appendChild(sub);
      if(LAYERS[L-1].en){const en=el("text",{class:"gband-cap",x:22,y:cy+30});en.textContent=LAYERS[L-1].en;gb.appendChild(en);}
    }
    gb.appendChild(el("line",{class:"gband-line",x1:G.LBL,y1:G.padT+G.bandH*LAYERS.length,x2:G.W-10,y2:G.padT+G.bandH*LAYERS.length}));
  }
  G.links.forEach(l=>{
    l.el=el("line",{class:"glink",stroke:"#5A6B8C","stroke-width":1.1,"stroke-opacity":.30});gl.appendChild(l.el);
    l.elt=el("text",{class:"gelabel","text-anchor":"middle"});l.elt.textContent=l.label;gl.appendChild(l.elt);
  });
  G.nodes.forEach(n=>{
    const g=el("g",{class:"gnode","data-id":n.id});
    const core=el("g",{class:"gn-core"});
    core.appendChild(el("circle",{r:n.r+5,fill:n.color,"fill-opacity":.16}));      // 光晕
    const c=el("circle",{r:n.r,fill:n.color,"fill-opacity":.92,stroke:"#0B1018","stroke-width":1.5});
    core.appendChild(c);n.elc=c;g.appendChild(core);
    const below=(n.li%2===0);                                                      // 交错上下，缓解标签拥挤
    const lb=el("text",{class:"glabel","text-anchor":"middle",y:below?n.r+14:-(n.r+7)});lb.textContent=n.label;g.appendChild(lb);
    n.el=g;gn.appendChild(g);
  });
  root.appendChild(gb);root.appendChild(gl);root.appendChild(gn);svg.appendChild(root);applyView();markSel();
}
function applyView(){if(G.root)G.root.setAttribute("transform",`translate(${G.view.x},${G.view.y}) scale(${G.view.k})`);}
function kick(a){G.alpha=Math.max(G.alpha,a);if(!G.raf)G.raf=requestAnimationFrame(loop);}
function loop(){G.raf=0;step();draw();if(G.alpha>0.012||G.drag)G.raf=requestAnimationFrame(loop);}
function step(){LAYOUT==="layered"?stepLayered():stepForce();}

function stepForce(){
  const N=G.nodes,a=Math.min(G.alpha,1);
  for(const l of G.links){const s=G.idx[l.s],t=G.idx[l.t];if(!s||!t)continue;
    const dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1,f=(d-112)*0.015*a,fx=dx/d*f,fy=dy/d*f;
    s.vx+=fx;s.vy+=fy;t.vx-=fx;t.vy-=fy;}
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
    const p=N[i],q=N[j];let dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
    if(d2<1){dx=rnd()-.5;dy=rnd()-.5;d2=dx*dx+dy*dy;}const d=Math.sqrt(d2);
    if(d2<30000){const f=1250*a/d2;p.vx-=dx/d*f;p.vy-=dy/d*f;q.vx+=dx/d*f;q.vy+=dy/d*f;}
    let minD=p.r+q.r+16;if(Math.abs(dy)<32)minD=Math.max(minD,(p.lw+q.lw)*0.40);
    if(d<minD){const push=(minD-d)*.5*Math.min(a*3,1),ux=dx/d,uy=dy/d;
      if(!(G.drag&&G.drag.node===p)){p.x-=ux*push;p.y-=uy*push;}
      if(!(G.drag&&G.drag.node===q)){q.x+=ux*push;q.y+=uy*push;}}
  }
  for(const n of N){if(G.drag&&G.drag.node===n){n.vx=0;n.vy=0;continue;}
    n.vx+=(G.W/2-n.x)*0.006*a;n.vy+=(G.H/2-n.y)*0.006*a;
    n.x+=n.vx*=.86;n.y+=n.vy*=.86;}
  G.alpha*=G.drag?1:.965;
}

function stepLayered(){
  const N=G.nodes,a=Math.min(G.alpha,1);
  for(const l of G.links){const s=G.idx[l.s],t=G.idx[l.t];if(!s||!t)continue;
    const fx=(t.x-s.x)*0.0011*a;s.vx+=fx;t.vx-=fx;}                 // 仅横向对齐
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
    const p=N[i],q=N[j];let dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
    if(d2<1){dx=rnd()-.5;dy=rnd()-.5;d2=dx*dx+dy*dy;}const d=Math.sqrt(d2);
    if(d2<32000){const f=1080*a/d2;p.vx-=dx/d*f;p.vy-=dy/d*f;q.vx+=dx/d*f;q.vy+=dy/d*f;}
    if(p.layer===q.layer){let minD=p.r+q.r+16;if(Math.abs(dy)<34)minD=Math.max(minD,(p.lw+q.lw)*0.44);
      if(d<minD){const push=(minD-d)*.5*Math.min(a*3,1),ux=dx/d,uy=dy/d;
        if(!(G.drag&&G.drag.node===p)){p.x-=ux*push;p.y-=uy*push;}
        if(!(G.drag&&G.drag.node===q)){q.x+=ux*push;q.y+=uy*push;}}}
  }
  const yIn=Math.min(40,G.bandH*0.34);
  for(const n of N){if(G.drag&&G.drag.node===n){n.vx=0;n.vy=0;continue;}
    n.vy+=(n.by-n.y)*0.085*a;                                       // 回吸到本层中线
    n.x+=n.vx*=.85;n.y+=n.vy*=.85;
    if(n.x<G.x0)n.x=G.x0;if(n.x>G.x1)n.x=G.x1;                      // 横向夹在画布内
    if(n.y<n.by-yIn)n.y=n.by-yIn;if(n.y>n.by+yIn)n.y=n.by+yIn;       // 纵向夹在本层带内
  }
  G.alpha*=G.drag?1:.965;
}

function draw(){
  for(const l of G.links){const s=G.idx[l.s],t=G.idx[l.t];if(!s||!t||!l.el)continue;
    l.el.setAttribute("x1",s.x.toFixed(1));l.el.setAttribute("y1",s.y.toFixed(1));
    l.el.setAttribute("x2",t.x.toFixed(1));l.el.setAttribute("y2",t.y.toFixed(1));
    if(l.elt){l.elt.setAttribute("x",((s.x+t.x)/2).toFixed(1));l.elt.setAttribute("y",((s.y+t.y)/2-3).toFixed(1));}}
  for(const n of G.nodes)n.el.setAttribute("transform",`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
}
function pt(box,ev){const r=box.getBoundingClientRect(),sx=G.W/r.width;
  const px=(ev.clientX-r.left)*sx,py=(ev.clientY-r.top)*sx;
  return {x:(px-G.view.x)/G.view.k,y:(py-G.view.y)/G.view.k,px,py};}
function bind(svg,box){
  svg.addEventListener("pointerdown",ev=>{
    const g=ev.target.closest?ev.target.closest(".gnode"):null;
    if(g){const n=G.idx[g.dataset.id];if(!n)return;G.drag={node:n,moved:0};
      try{svg.setPointerCapture(ev.pointerId)}catch(e){}n.el.classList.add("dragging");kick(.7);hidePop();}
    else{G.pan={x:ev.clientX,y:ev.clientY,vx:G.view.x,vy:G.view.y};try{svg.setPointerCapture(ev.pointerId)}catch(e){}}
  });
  svg.addEventListener("pointermove",ev=>{
    if(G.drag){const p=pt(box,ev),n=G.drag.node;G.drag.moved+=Math.abs(p.x-n.x)+Math.abs(p.y-n.y);
      n.x=p.x;n.y=p.y;n.vx=0;n.vy=0;kick(.5);}
    else if(G.pan){const r=box.getBoundingClientRect(),sx=G.W/r.width;
      G.view.x=G.pan.vx+(ev.clientX-G.pan.x)*sx;G.view.y=G.pan.vy+(ev.clientY-G.pan.y)*sx;applyView();}
    else{const g=ev.target.closest?ev.target.closest(".gnode"):null;hov(g?g.dataset.id:null,box,ev);}
  });
  const end=()=>{if(G.drag){G.drag.node.el.classList.remove("dragging");
    if(G.drag.moved<5){G.sel=G.drag.node.id;markSel();detail(G.drag.node.id);}G.drag=null;kick(.3);}G.pan=null;};
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  svg.addEventListener("pointerleave",()=>{hov(null);G.pan=null;});
  svg.addEventListener("wheel",ev=>{ev.preventDefault();const p=pt(box,ev);
    const k2=Math.max(.4,Math.min(3,G.view.k*Math.exp(-ev.deltaY*0.0016)));
    G.view.x=p.px-p.x*k2;G.view.y=p.py-p.y*k2;G.view.k=k2;applyView();},{passive:false});
}
function markSel(){for(const n of G.nodes){const on=G.sel===n.id;
  n.elc.setAttribute("stroke",on?"#fff":"#0B1018");n.elc.setAttribute("stroke-width",on?2.5:1.5);}}
function applyGroupLit(){
  if(!G.litGroup){for(const n of G.nodes)n.el.classList.remove("dim");
    for(const l of G.links)l.el.classList.remove("dim");return;}
  for(const n of G.nodes)n.el.classList.toggle("dim",n.group!==G.litGroup);
  for(const l of G.links){const a=G.idx[l.s].group===G.litGroup||G.idx[l.t].group===G.litGroup;
    l.el.classList.toggle("dim",!a);}
}
function hov(id,box,ev){
  if(G.litGroup)return;
  if(G.hover===id){if(id&&ev)posPop(box,ev);return;}G.hover=id;
  if(!id){for(const n of G.nodes)n.el.classList.remove("dim","pop");
    for(const l of G.links){l.el.classList.remove("dim");if(l.elt)l.elt.classList.remove("dim");l.elt.style.opacity=0;}
    hidePop();return;}
  const nb=G.nbr[id]||new Set();
  for(const n of G.nodes){const on=n.id===id||nb.has(n.id);n.el.classList.toggle("dim",!on);n.el.classList.toggle("pop",n.id===id);}
  for(const l of G.links){const a=l.s===id||l.t===id;l.el.classList.toggle("dim",!a);
    if(l.elt){l.elt.classList.toggle("dim",!a);l.elt.style.opacity=a?1:0;}}
  showPop(G.idx[id],box,ev);
}
let popEl=null;
function showPop(n,box,ev){hidePop();if(!n)return;popEl=document.createElement("div");popEl.className="g-pop";
  popEl.innerHTML=`<b>${esc(n.label)}</b> <span style="color:${n.color}">· ${esc(GLABEL[n.group])}</span>
    <div style="color:#9AA6BE;margin-top:5px">${esc(n.desc||"")}</div>
    <div style="color:#6E7A96;margin-top:6px;font-size:11px">点击查看详情</div>`;
  box.appendChild(popEl);if(ev)posPop(box,ev);}
function posPop(box,ev){if(!popEl)return;const r=box.getBoundingClientRect();
  let x=ev.clientX-r.left+14,y=ev.clientY-r.top+12;
  if(x+popEl.offsetWidth>r.width-8)x=ev.clientX-r.left-popEl.offsetWidth-12;
  if(y+popEl.offsetHeight>r.height-8)y=ev.clientY-r.top-popEl.offsetHeight-12;
  popEl.style.left=Math.max(4,x)+"px";popEl.style.top=Math.max(4,y)+"px";}
function hidePop(){if(popEl){popEl.remove();popEl=null;}}
function detail(id){
  const n=G.idx[id],box=$("#g-detail");
  const nb=[...(G.nbr[id]||[])].map(x=>G.idx[x]).filter(Boolean);
  box.innerHTML=`<span class="ph">${esc(GLABEL[n.group])}</span>
    <div class="nm">${esc(n.label)}<span class="gp" style="background:${n.color}22;color:${n.color}">${esc(GLABEL[n.group])}</span></div>
    <div class="ds">${esc(n.desc||"")}</div>
    ${(n.props||[]).map(p=>`<div class="pr"><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}
    <div class="nbtit">关联节点（${nb.length}）— 点击跳转</div>
    <div>${nb.map(x=>`<span class="nb" data-go="${x.id}" style="background:${x.color}22;color:${x.color}">${esc(x.label)}</span>`).join("")}</div>`;
  box.querySelectorAll(".nb").forEach(b=>b.addEventListener("click",()=>{
    G.sel=b.dataset.go;markSel();detail(b.dataset.go);focusNode(b.dataset.go);}));
}
function focusNode(id){const n=G.idx[id];if(!n)return;
  G.view.k=Math.max(G.view.k,1.1);G.view.x=G.W/2-n.x*G.view.k;G.view.y=G.H/2-n.y*G.view.k;applyView();kick(.2);}
function legend(){
  const box=$("#g-legend");box.innerHTML="";
  GROUPS.forEach(g=>{const d=document.createElement("div");d.className="lg";d.dataset.g=g.id;
    d.innerHTML=`<span class="sw" style="background:${g.color}"></span>${g.label}`;
    d.addEventListener("click",()=>{
      const on=G.litGroup===g.id;G.litGroup=on?null:g.id;
      box.querySelectorAll(".lg").forEach(x=>x.classList.toggle("active",!on&&x.dataset.g===g.id));
      if(G.litGroup){hov(null);}applyGroupLit();});
    box.appendChild(d);});
}
function init(){
  const svg=$("#graph-svg"),box=$("#graph-box");
  G.W=Math.max(box.clientWidth||0,640);G.H=Math.max(box.clientHeight||0,560);
  svg.setAttribute("viewBox",`0 0 ${G.W} ${G.H}`);
  build();dom(svg);legend();if(!G.bound){bind(svg,box);G.bound=true;}kick(1);
  $("#g-mode").addEventListener("click",()=>{LAYOUT=LAYOUT==="layered"?"force":"layered";
    _seed=20240101;G.view={x:0,y:0,k:1};applyView();build();dom(svg);kick(1);});
  $("#g-reset").addEventListener("click",()=>{G.view={x:0,y:0,k:1};applyView();G.sel=null;markSel();
    G.litGroup=null;$("#g-legend").querySelectorAll(".lg").forEach(x=>x.classList.remove("active"));applyGroupLit();
    $("#g-detail").innerHTML="";$("#g-search").value="";});
  $("#g-relayout").addEventListener("click",()=>{_seed=(Date.now()&0x7fffffff);build();dom(svg);kick(1);});
  $("#g-search").addEventListener("input",e=>{
    const q=e.target.value.trim();if(!q){hov(null);return;}
    const hit=G.nodes.find(n=>n.label.includes(q)||n.id.toLowerCase()===q.toLowerCase());
    if(hit){G.sel=hit.id;markSel();detail(hit.id);focusNode(hit.id);
      G.litGroup=null;$("#g-legend").querySelectorAll(".lg").forEach(x=>x.classList.remove("active"));
      hov(hit.id,box,null);}});
}
if("requestIdleCallback"in window)requestIdleCallback(init);else setTimeout(init,80);
window.addEventListener("resize",()=>{const box=$("#graph-box");if(!box)return;
  const w=Math.max(box.clientWidth||0,640),h=Math.max(box.clientHeight||0,560);
  if(Math.abs(w-G.W)>40){G.W=w;G.H=h;$("#graph-svg").setAttribute("viewBox",`0 0 ${G.W} ${G.H}`);
    build();dom($("#graph-svg"));kick(.8);}});
</script>
</body>
